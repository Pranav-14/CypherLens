[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cypherlens"
version = "1.0.0"
description = "Real-time web search simplifier, deal finder, and zero-cost price radar"
readme = "README.md"
authors = [{ name = "Pranav" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "rich>=13.7.0",
    "ddgs>=9.0.0",
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "click>=8.1.0"
]

[project.scripts]
cypherlens = "cypherlens.cli:main"

[project.urls]
Homepage = "https://github.com/Pranav-14/cypherlens"
Repository = "https://github.com/Pranav-14/cypherlens"
